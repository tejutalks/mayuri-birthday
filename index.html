<style>

t-size:clamp(3.1rem,12vw,6.3rem);line-height:.88;letter-spacing:-.075em;margin:22px 0 20px}h1 span{display:block;color:var(--pink);font:italic 500 1em Georgia,serif;margin-top:12px}h2{font-size:clamp(1.6rem,6vw,2.3rem);letter-spacing:-.04em;color:#ff9fbe;margin:12px 0}.copy{max-width:490px;margin:0 auto 22px;color:var(--muted);line-height:1.8;font-size:.96rem}.btn{border:1px solid #9e5878;border-radius:999px;background:#32192d;color:#ffedf4;padding:12px 19px;font-weight:800;box-shadow:0 8px 28px #0003;transition:.2s}.btn:hover{transform:translateY(-2px);background:#4b203a}.primary{background:linear-gradient(115deg,#b93370,#ef719e);border-color:#ffc1d8}.gold{background:linear-gradient(120deg,#c18b3e,#f3cb7a);color:#401a2d;border-color:#ffe5a7}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.micro,.counter{font-size:.76rem;color:#a98498;margin-top:15px}.memory{height:300px;display:grid;place-items:center;position:relative;margin:5px auto 14px}.polaroid{position:absolute;width:min(190px,54vw);padding:8px 8px 12px;background:#fff8f1;color:#6b4053;box-shadow:0 16px 45px #0008;transform:rotate(-5deg)}.polaroid.photo-two{transform:translate(92px,14px) rotate(8deg);z-index:2}.polaroid.photo-three{transform:translate(-86px,17px) rotate(-10deg);z-index:1}.polaroid.photo-one{transform:translateY(-5px) rotate(-2deg);z-index:3}.polaroid img{height:205px;object-fit:cover}.polaroid.back{transform:translate(23px,5px) rotate(7deg);opacity:.7}.polaroid img,.placeholder{width:100%;height:190px;object-fit:cover;background:linear-gradient(135deg,#f6bdd1,#e8dcff)}.placeholder{display:grid;place-items:center;padding:15px;color:#783b5b;font-size:.85rem}.caption{font:italic .82rem Georgia,serif;margin-top:9px}.upload{display:inline-block;border:1px dashed #b66d8d;padding:9px 13px;border-radius:999px;color:#ffd9e7;font-size:.8rem;cursor:pointer}input[type=file]{display:none}.balloons{display:grid;grid-template-columns:repeat(3,60px);gap:16px 17px;justify-content:center;margin:24px auto}.balloon{width:55px;height:70px;border:1px solid #fff8;border-radius:50% 50% 45% 45%;box-shadow:inset -8px -7px 12px #0002,inset 7px 5px 12px #fff5,0 8px 20px #0003;animation:sway 2.7s infinite}.balloon:after{content:"";position:absolute}.balloon:nth-child(1){background:#ff5d9b}.balloon:nth-child(2){background:#ffc24d;animation-delay:.2s}.balloon:nth-child(3){background:#5dc9f3;animation-delay:.5s}.balloon:nth-child(4){background:#a78bfa;animation-delay:.8s}.balloon:nth-child(5){background:#82dc9b;animation-delay:.3s}.balloon:nth-child(6){background:#ff887d;animation-delay:.6s}@keyframes sway{50%{transform:translateY(-6px) rotate(4deg)}}.balloon.popped{animation:pop .3s forwards;pointer-events:none}@keyframes pop{to{transform:scale(1.6);opacity:0;visibility:hidden}}.wish{min-height:50px;display:grid;place-items:center;max-width:440px;margin:auto;color:#ffe1ec;line-height:1.6}.puzzle{width:min(270px,78vw);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:20px auto;padding:5px;border:1px solid #75445f;border-radius:16px;background:#120b15}.tile{border:1px solid #ffffff40;border-radius:9px;background:linear-gradient(145deg,#ffb2ce,#a58bfa);color:#4c1b39;font-weight:900;font-size:1.15rem}.tile.blank{background:#100a12;border:1px dashed #5d354d;color:transparent}.scratch{height:165px;width:min(390px,100%);position:relative;margin:20px auto 10px;border-radius:18px;overflow:hidden;border:2px solid #eac574;touch-action:none;background:linear-gradient(125deg,#ff7eb3,#a16bff,#3fc8e8)}.under{position:absolute;inset:0;display:grid;place-content:center;text-shadow:0 2px 10px #58204f}.under strong{font-size:1.35rem}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .5s}.envelope{width:min(310px,85%);height:180px;position:relative;margin:22px auto 8px;border:0;background:transparent;filter:drop-shadow(0 15px 20px #0005)}.envback{position:absolute;inset:0;background:#b97a3f;border-radius:7px}.envfront{position:absolute;inset:0;background:#e7ae5e;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}.flap{position:absolute;inset:0;background:#f5d28a;clip-path:polygon(0 0,100% 0,50% 62%);transform-origin:top;transition:transform .7s;z-index:3}.seal{position:absolute;z-index:4;top:44%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#d64e83}.envelope.open .flap{transform:rotateX(180deg);z-index:0}.letter{display:none;text-align:left;white-space:pre-line;max-width:510px;margin:20px auto 0;padding:22px;border-radius:16px;border:1px solid #7c4b63;background:#1b111c;color:#fbe7ef;font:italic 1rem/1.9 Georgia,serif}.letter.show{display:block;animation:enter .6s;max-height:none;overflow:visible;overflow-wrap:anywhere}.float{position:fixed;bottom:-40px;z-index:10;pointer-events:none;animation:rise 4s linear forwards}@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}.conf{position:fixed;top:-12px;width:7px;height:12px;z-index:12;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:.1}}.footer{text-align:center;color:#8f6980;font-size:.7rem;padding:0 10px 12px}@media(max-height:700px){main{align-items:start}.stage{margin:auto}.memory{height:220px}.polaroid img,.placeholder{height:160px}.card{padding:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style></head><body><div class="app"><header class="top"><span>♡ a little world for Mayuri Akka</span><span style="display:flex;align-items:center;gap:10px"><button id="musicBtn" class="btn" style="padding:6px 10px;font-size:.72rem" aria-label="Play birthday tune">♫ Play tune</button><span class="count" id="count">A surprise for you</span></span></header><div class="track"><div class="fill" id="fill"></div></div><main><div class="stage" id="stage"></div></main><div class="footer">made with love, just for Mayuri · ♡</div></div>
<script>
const screens=[
{count:"A surprise for you",pct:0,html:`<div class="heartlogo">♡</div><div class="kicker">a tiny surprise made with love</div><h1>Happy Birthday,<span>Mayuri Akka</span></h1><p class="copy">I made a little world just for you. There are memories, wishes, a tiny challenge, and one letter waiting at the end. Take your time — this is all yours. 💗</p><button class="btn primary" id="next">Open your surprise ✨</button><div class="micro">one surprise at a time · made just for you</div>`},
{count:"Surprise 1 of 5",pct:20,html:`<div class="card"><div class="kicker">01 · little moments</div><h2>Our Cute Memories 💞</h2><p class="copy">Three little snapshots, saved here just for you. Every photo holds a memory and a little piece of our love.</p><div class="memory" id="memory"><div class="polaroid photo-three"><img src="photos/mayuri-akka-1.jpg" alt="Mayuri Akka, a favourite memory"><div class="caption">a moment to keep forever 💗</div></div><div class="polaroid photo-two"><img src="photos/mayuri-akka-2.jpg" alt="Mayuri Akka smiling"><div class="caption">that beautiful smile ✨</div></div><div class="polaroid photo-one"><img src="photos/mayuri-akka-3.jpg" alt="A special photo of Mayuri Akka"><div class="caption">our lovely Mayuri Akka 🫶</div></div></div><div class="btnrow"><button class="btn primary" id="next">Keep these memories →</button></div></div>`},
{count:"Surprise 2 of 5",pct:40,html:`<div class="card"><div class="kicker">02 · make a wish</div><h2>Pop the Wishes 🎈</h2><p class="copy">Six little wishes are floating here for you. Tap every balloon to collect them.</p><div class="balloons" id="balloons"></div><div class="wish" id="wish">A little wish is waiting inside each balloon…</div><div class="counter" id="bc">0 of 6 wishes found</div><div class="btnrow"><button class="btn primary" id="next" disabled>All wishes collected ✓</button></div></div>`},
{count:"Surprise 3 of 5",pct:60,html:`<div class="card"><div class="kicker">03 · just between siblings 🔐</div><h2>One Little Question 💗</h2><p class="copy">Okay, Akka… let's see if you remember your own special nickname for your brother!</p><div style="font-size:2.4rem;margin:12px 0">🥹❤️</div><h3 style="font-size:clamp(1.15rem,4vw,1.55rem);line-height:1.5">“What do you call your brother with love?”</h3><div style="margin:18px auto 8px;max-width:360px;text-align:left;border:1px solid #75445f;background:#201321;border-radius:14px;padding:13px 15px"><div style="font-size:.72rem;color:#ffbad3;font-weight:800;margin-bottom:5px">💡 LITTLE HINT</div><div style="font-size:.88rem;color:#d9b5c7;line-height:1.6">It's your special nickname for your annoying but loving brother! 😂💗</div></div><form id="answerform" style="max-width:360px;margin:18px auto 0"><input id="answer" type="text" autocomplete="off" placeholder="Type your answer here…" aria-label="Your answer" style="width:100%;padding:14px 16px;border-radius:13px;border:1px solid #9e5878;background:#140c16;color:#fff1f7;font:inherit;outline:none"><button class="btn primary" style="margin-top:12px;width:100%" type="submit">Unlock my next surprise ✨</button></form><div class="wish" id="pm" aria-live="polite"></div><div class="btnrow"><button class="btn primary" id="next" disabled>Correct! Continue →</button></div></div>`},
{count:"Surprise 4 of 5",pct:80,html:`<div class="card"><div class="kicker">04 · hidden just for you</div><h2>One Last Surprise ✨</h2><p class="copy">Scratch the card with your finger to reveal what is hiding underneath.</p><div class="scratch"><div class="under"><strong>Happy Birthday! 🎉</strong><span>You are loved more than you know 💗</span></div><canvas id="sc"></canvas></div><div class="counter" id="scstatus">Scratch across the card to reveal it.</div><div class="btnrow"><button class="btn" id="reveal">Reveal it for me</button><button class="btn primary" id="next" disabled>Read my letter 💌</button></div></div>`},
{count:"The last surprise ♡",pct:100,html:`<div class="card"><div class="kicker">05 · from my heart</div><h2>A Letter Just For You 💌</h2><p class="copy">A little envelope, holding words I might not say often enough. Tap it to open.</p><button class="envelope" id="env" aria-label="Open letter"><span class="envback"></span><span class="flap"></span><span class="envfront"></span><span class="seal">♥</span></button><div class="counter" id="ehint">tap the envelope to open ♡</div><div class="letter" id="letter">My dearest Mayuri Akka, 💗

Happy Birthday to my favourite akka! 🥹🫶

First of all, please smile while reading this. Yes, YOU! 😊 If you're smiling right now, mission successful. If not, I reserve the right to keep making terrible jokes until you do. 😂

Honestly, I may tease you, annoy you, and act like a little troublemaker sometimes, but behind all that is a brother who loves you a lot. Some of my favourite memories are the simple ones with you — laughing over silly things, our little arguments, and those moments that become funny again five minutes later. Life wouldn't be the same without you.

I’m wishing you a year full of happiness, confidence, good health, and beautiful surprises. Whenever things get stressful, remember how capable you are. Take things one step at a time, believe in yourself, and don't be too hard on yourself. You deserve to feel proud of how far you've come. 🌷

And now, an important official announcement about your engineering journey… 🎓✨

I really hope this is the year you shine in your engineering journey, learn amazing things, achieve your goals, and get closer to the future you're working for. I’ll be cheering for you the whole way!

BUT… please remember one tiny detail: after next year, when you get a job at a good company, don't forget to REFER YOUR BROTHER! 🤣💼 I'll accept a great role, a good salary, and maybe a little VIP treatment because I'm your brother. No pressure, Akka — just casually adding this to your birthday wishes. 😂🤝

Jokes aside, I truly hope you succeed and get every opportunity you've worked hard for. And whenever you need someone to encourage you, listen to you, or remind you how special you are, I'm here.

No matter how grown-up we get, you'll always be my Mayuri Akka, and I'll always be your annoying-but-loving brother. Keep smiling, keep shining, and never forget how much you mean to me. ❤️

Happy Birthday, Akka! May this year bring you success, laughter, and a thousand reasons to smile. And don't worry — I'll remind you about that company referral next year. Screenshot this if necessary! 😂📸

Love you always and forever. 🫶

— Your loving, slightly job-hunting brother 💗</div><div class="btnrow"><button class="btn primary" id="celebrate">Celebrate Mayuri Akka! 🎉</button><button class="btn" id="replay">Replay from the beginning ↺</button></div></div>`}
];
let idx=0;function render(i){idx=i;const s=screens[i];document.getElementById('stage').innerHTML=s.html;document.getElementById('count').textContent=s.count;document.getElementById('fill').style.width=s.pct+'%';window.scrollTo(0,0);bind(s.count)}
function next(){if(idx<screens.length-1){floatHearts(16);render(idx+1)}}
function bind(k){const n=document.getElementById('next');if(n)n.onclick=next;
if(k.startsWith('Surprise 2'))balloonSetup();if(k.startsWith('Surprise 3'))answerSetup();if(k.startsWith('Surprise 4'))scratchSetup();if(k.startsWith('The last'))letterSetup()}
const wishes=["May your dreams come closer this year ✨","Thank you for every single laugh 😊","You deserve all the soft, happy things 💗","May you always feel loved and supported 🌷","Keep shining in your own beautiful way 🌟","A big virtual hug from your sibling 🫶"];
function balloonSetup(){let found=0,g=document.getElementById('balloons');wishes.forEach((w,i)=>{let b=document.createElement('button');b.className='balloon';b.setAttribute('aria-label','Pop wish '+(i+1));b.onclick=()=>{if(b.classList.contains('popped'))return;b.classList.add('popped');document.getElementById('wish').textContent=w;document.getElementById('bc').textContent=++found+' of 6 wishes found';floatHearts(4);if(found===6){document.getElementById('wish').textContent='Every wish is yours, Mayuri Akka. Keep them close. 💗';document.getElementById('next').disabled=false;confetti()}};g.append(b)})}
function answerSetup(){
 const form=document.getElementById('answerform');
 const input=document.getElementById('answer');
 const msg=document.getElementById('pm');
 const btn=document.getElementById('next');
 const unlock=document.querySelector('#answerform button[type="submit"]');
 function checkAnswer(e){
  if(e)e.preventDefault();
  // Ignore spaces, punctuation, and letter case; accept common spellings.
  const answer=(input.value||'').normalize('NFKD').toLowerCase().replace(/[^a-z]/g,'');
  if(['anya','anyya'].includes(answer)){
   msg.textContent='Awww, correct, Mayuri Akka! 🥹💗 You know your Anya!';
   msg.style.color='#ffd0e1';
   btn.disabled=false;
   input.style.borderColor='#8de0ad';
   unlock.textContent='That’s right! ✨';
   confetti();floatHearts(10);
  } else {
   msg.textContent='Not quite, Akka 😜 Try “Anya” or “Anyya” — the nickname you use for your brother!';
   msg.style.color='#ffb6c9';
   input.style.borderColor='#ff789e';
   input.focus();
  }
 }
 form.addEventListener('submit',checkAnswer);
 unlock.addEventListener('click',checkAnswer);
 input.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer(e)});
}
function scratchSetup(){let c=document.getElementById('sc'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);let g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#c6a052');g.addColorStop(.5,'#e8ce86');g.addColorStop(1,'#9f7137');x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.fillStyle='#fff3cf';x.textAlign='center';x.font='bold 15px system-ui';x.fillText('✦ SCRATCH HERE ✦',r.width/2,r.height/2);x.font='12px system-ui';x.fillText('make a little wish',r.width/2,r.height/2+22);x.globalCompositeOperation='destination-out';let done=false;function reveal(){if(done)return;done=true;c.style.opacity=0;document.getElementById('scstatus').textContent='You uncovered your surprise! Happy Birthday, Mayuri Akka! 💗';document.getElementById('next').disabled=false;floatHearts(14)}function erase(e){let b=c.getBoundingClientRect();x.beginPath();x.arc(e.clientX-b.left,e.clientY-b.top,19,0,Math.PI*2);x.fill();let data=x.getImageData(0,0,c.width,c.height).data,clear=0;for(let k=3;k<data.length;k+=40)if(data[k]<20)clear++;if(clear>data.length/40*.43)reveal()}let active=false;c.onpointerdown=e=>{active=true;c.setPointerCapture(e.pointerId);erase(e)};c.onpointermove=e=>{if(active)erase(e)};c.onpointerup=()=>active=false;c.onpointercancel=()=>active=false;document.getElementById('reveal').onclick=reveal}
function letterSetup(){document.getElementById('env').onclick=()=>{document.getElementById('env').classList.add('open');document.getElementById('letter').classList.add('show');document.getElementById('ehint').textContent='a little love, just for you 💗';floatHearts(12)};document.getElementById('celebrate').onclick=()=>{confetti();floatHearts(35)};document.getElementById('replay').onclick=()=>render(0)}
function floatHearts(n){let a=['💗','💕','♡','💖','✨'];for(let i=0;i<n;i++){let e=document.createElement('span');e.className='float';e.textContent=a[Math.random()*a.length|0];e.style.left=Math.random()*100+'vw';e.style.fontSize=(13+Math.random()*17)+'px';e.style.animationDuration=(3+Math.random()*3)+'s';document.body.append(e);setTimeout(()=>e.remove(),6500)}}
function confetti(){let colors=['#ff82ad','#f6d38a','#a78bfa','#67d7df','#ffc1d8'];for(let i=0;i<90;i++){let e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=colors[Math.random()*colors.length|0];e.style.animationDelay=Math.random()*.6+'s';document.body.append(e);setTimeout(()=>e.remove(),4000)}}
let musicCtx=null,musicTimer=null,musicOn=false,musicStep=0,musicNodes=[];
const tune=[72,76,79,84,81,79,76,74,72,76,79,86,84,81,79,76,74,77,81,86,84,81,77,74,71,74,79,83,81,79,74,71,72,76,79,84,88,86,84,79,76,79,84,88,86,84,81,79,74,77,81,86,89,86,84,81,72,76,79,84,79,76,74,72];
function musicNote(freq,start,dur,vol,type){
 if(!musicCtx)return;
 const o=musicCtx.createOscillator(),g=musicCtx.createGain();
 o.type=type||'triangle';o.frequency.setValueAtTime(freq,start);
 g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.025);g.gain.exponentialRampToValueAtTime(.0001,start+dur);
 o.connect(g);g.connect(musicCtx.destination);o.start(start);o.stop(start+dur+.04);
 musicNodes.push(o);o.onended=()=>{musicNodes=musicNodes.filter(n=>n!==o);try{o.disconnect();g.disconnect()}catch(e){}};
}
async function startMusic(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio unavailable');
  if(!musicCtx)musicCtx=new AC();
  if(musicCtx.state!=='running')await musicCtx.resume();
  if(musicCtx.state!=='running')throw new Error('Browser has not enabled audio yet');
  musicOn=true;if(musicTimer)clearInterval(musicTimer);
  const beat=60/92;
  function step(){
   if(!musicOn)return;const now=musicCtx.currentTime,n=tune[musicStep%tune.length],f=x=>440*Math.pow(2,(x-69)/12);
   musicNote(f(n),now,beat*.42,.24,'triangle');musicNote(f(n-12),now,beat*.4,.075,'sine');
   if(musicStep%8===0){const chords=[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]];chords[Math.floor(musicStep/8)%4].forEach(x=>musicNote(f(x+12),now,beat*1.8,.045,'sine'));musicNote(f(chords[Math.floor(musicStep/8)%4][0]-12),now,beat*.7,.085,'sine')}
   musicStep++;
  }
  step();musicTimer=setInterval(step,beat*500);
  const b=document.getElementById('musicBtn');if(b)b.textContent='♫ Pause tune';
 }catch(e){const b=document.getElementById('musicBtn');if(b)b.textContent='♫ Tap to play';}
}
function stopMusic(){musicOn=false;if(musicTimer){clearInterval(musicTimer);musicTimer=null;}musicNodes.forEach(o=>{try{o.stop()}catch(e){}});musicNodes=[];const b=document.getElementById('musicBtn');if(b)b.textContent='♫ Play tune';}
function toggleMusic(){if(musicOn && musicCtx && musicCtx.state==='running')stopMusic();else startMusic();}
document.getElementById('musicBtn').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleMusic();});



render(0);
setInterval(()=>{if(Math.random()>.5)floatHearts(1)},1900);
// Try autoplay on page load. Browsers may block sound until the visitor interacts;
// if blocked, start on the first tap/click/key press anywhere on the page.
window.addEventListener('load',()=>{startMusic();});
function startMusicOnFirstInteraction(event){
 // Do not start on pointerdown of the music button itself; its click handler toggles playback.
 if(event && event.target && event.target.closest && event.target.closest('#musicBtn')) return;
 if(!musicCtx || musicCtx.state!=='running') startMusic();
}
window.addEventListener('pointerdown',startMusicOnFirstInteraction);
window.addEventListener('keydown',startMusicOnFirstInteraction);
</script></body></html>
